name: Terraform CI (Terramate)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  id-token: write   # OIDC token for AWS auth — no long-lived access keys
  contents: read
  pull-requests: write

env:
  TERRAMATE_VERSION: "0.15.4"
  TERRAFORM_VERSION: "1.10.5"
  AWS_REGION: "eu-central-1"

jobs:
  # ── Validate: run on every PR ──────────────────────────────────────────────
  validate:
    name: Validate changed stacks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout (full history for change detection)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Terramate
        uses: terramate-io/terramate-action@v2
        with:
          version: ${{ env.TERRAMATE_VERSION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terraform fmt check
        run: terraform fmt -check -recursive deployment/

      - name: List changed stacks
        id: list
        run: |
          terramate list --changed 2>/dev/null || echo "No changed stacks"

      - name: Terraform validate (changed stacks only)
        run: |
          terramate run --changed -- terraform init -backend=false
          terramate run --changed -- terraform validate

  # ── Plan: runs on PRs to surface diff ─────────────────────────────────────
  plan:
    name: Plan changed stacks
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terramate
        uses: terramate-io/terramate-action@v2
        with:
          version: ${{ env.TERRAMATE_VERSION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terramate generate
        run: terramate generate

      - name: Terraform init (changed stacks)
        run: terramate run --changed -- terraform init

      - name: Terraform plan (changed stacks)
        run: terramate run --changed -- terraform plan -out=tfplan.binary

  # ── Apply: runs on push to main only ──────────────────────────────────────
  apply:
    name: Apply changed stacks
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    environment: production

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install Terramate
        uses: terramate-io/terramate-action@v2
        with:
          version: ${{ env.TERRAMATE_VERSION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Terramate generate
        run: terramate generate

      - name: Terraform init (changed stacks)
        run: terramate run --changed -- terraform init

      - name: Terraform apply (changed stacks, auto-approve)
        run: terramate run --changed -- terraform apply -auto-approve
